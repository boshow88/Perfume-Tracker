<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">Perfume Tracker</h1>
            <div class="header-actions">
                <button id="sort-btn" class="btn btn-action">
                    <span class="icon">↕</span>
                    <span class="label">Sort</span>
                </button>
                <button id="filter-btn" class="btn btn-action">
                    <span class="icon">⏚</span>
                    <span class="label">Filter</span>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search perfumes...">
                <span class="search-icon">🔍</span>
            </div>
        </div>

        <!-- Filter Tags Display -->
        <div id="active-filters" class="active-filters hidden"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Perfume List -->
            <section class="perfume-list-section">
                <div class="list-header">
                    <span class="col-brand">Brand</span>
                    <span class="col-name">Name</span>
                    <span class="col-conc">Conc.</span>
                    <span class="col-location">Location</span>
                </div>
                <div id="perfume-list" class="perfume-list">
                    <div class="loading">Loading...</div>
                </div>
                <div class="list-footer">
                    <span id="perfume-count">0 perfumes</span>
                </div>
            </section>

            <!-- Detail Panel -->
            <aside id="detail-panel" class="detail-panel hidden">
                <button id="close-detail" class="btn-close">✕</button>
                
                <div class="detail-header">
                    <h2 id="detail-brand" class="detail-brand"></h2>
                    <h3 id="detail-name-conc" class="detail-name-conc"></h3>
                    <p id="detail-state" class="detail-state"></p>
                </div>

                <!-- Notes Section -->
                <section id="notes-section" class="detail-section hidden">
                    <h4 class="section-title">Notes</h4>
                    <div id="notes-content" class="notes-content"></div>
                </section>

                <!-- Fragrantica Section -->
                <section id="fragrantica-section" class="detail-section hidden">
                    <div class="fragrantica-header">
                        <h4 class="section-title">Fragrantica Votes</h4>
                        <button id="toggle-all-votes" class="btn btn-small">++</button>
                    </div>
                    <div id="fragrantica-content" class="fragrantica-content"></div>
                </section>

                <!-- Events Section -->
                <section id="events-section" class="detail-section hidden">
                    <h4 class="section-title">Events</h4>
                    <div id="events-content" class="events-content"></div>
                </section>

                <!-- Links Section -->
                <section id="links-section" class="detail-section hidden">
                    <h4 class="section-title">Links</h4>
                    <div id="links-content" class="links-content"></div>
                </section>

                <!-- Tags Section -->
                <section id="tags-section" class="detail-section hidden">
                    <h4 class="section-title">Tags</h4>
                    <div id="tags-content" class="tags-content"></div>
                </section>
            </aside>
        </main>

        <!-- Sort Modal -->
        <div id="sort-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-content modal-small">
                <div class="modal-header">
                    <h3>Sort</h3>
                    <button class="btn-close modal-close">✕</button>
                </div>
                <div class="modal-body">
                    <!-- Active sort dimensions -->
                    <div class="sort-dimensions" id="sort-dimensions">
                        <p class="sort-empty">No sorting applied</p>
                    </div>
                    <!-- Add new dimension -->
                    <div class="sort-add">
                        <select id="sort-add-field">
                            <option value="">+ Add sort level...</option>
                            <option value="brand">Brand</option>
                            <option value="name">Name</option>
                            <option value="concentration">Concentration</option>
                            <option value="state">State</option>
                            <option value="rating">Rating</option>
                            <option value="longevity">Longevity</option>
                            <option value="sillage">Sillage</option>
                            <option value="value">Price Value</option>
                            <option value="created">Created</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="sort-clear" class="btn btn-secondary">Clear</button>
                    <button id="sort-apply" class="btn btn-primary">Apply</button>
                </div>
            </div>
        </div>

        <!-- Filter Modal -->
        <div id="filter-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Filters</h3>
                    <button class="btn-close modal-close">✕</button>
                </div>
                <div class="modal-body">
                    <!-- State Filter -->
                    <div class="filter-group">
                        <label>State</label>
                        <div class="checkbox-group" id="filter-state">
                            <label class="checkbox-item">
                                <input type="checkbox" value="owned"> Owned
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="smelled"> Smelled
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="on-skin"> On-skin
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="want"> Want
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="new"> New
                            </label>
                        </div>
                    </div>
                    <!-- Score Filters -->
                    <div class="filter-group">
                        <label>Score Ranges</label>
                        <div class="score-filters">
                            <div class="score-filter-item" data-score="rating" data-max="5">
                                <div class="score-filter-header">
                                    <span class="score-label">Rating</span>
                                    <label class="exclude-toggle">
                                        <input type="checkbox" class="score-exclude"> Exclude
                                    </label>
                                </div>
                                <div class="range-slider-container">
                                    <input type="range" class="range-min" min="0" max="5" step="0.1" value="0">
                                    <input type="range" class="range-max" min="0" max="5" step="0.1" value="5">
                                    <div class="range-track"></div>
                                    <div class="range-selected"></div>
                                </div>
                                <div class="range-values">
                                    <span class="range-value-min">0</span>
                                    <span class="range-value-max">5</span>
                                </div>
                            </div>
                            <div class="score-filter-item" data-score="longevity" data-max="5">
                                <div class="score-filter-header">
                                    <span class="score-label">Longevity</span>
                                    <label class="exclude-toggle">
                                        <input type="checkbox" class="score-exclude"> Exclude
                                    </label>
                                </div>
                                <div class="range-slider-container">
                                    <input type="range" class="range-min" min="0" max="5" step="0.1" value="0">
                                    <input type="range" class="range-max" min="0" max="5" step="0.1" value="5">
                                    <div class="range-track"></div>
                                    <div class="range-selected"></div>
                                </div>
                                <div class="range-values">
                                    <span class="range-value-min">0</span>
                                    <span class="range-value-max">5</span>
                                </div>
                            </div>
                            <div class="score-filter-item" data-score="sillage" data-max="4">
                                <div class="score-filter-header">
                                    <span class="score-label">Sillage</span>
                                    <label class="exclude-toggle">
                                        <input type="checkbox" class="score-exclude"> Exclude
                                    </label>
                                </div>
                                <div class="range-slider-container">
                                    <input type="range" class="range-min" min="0" max="4" step="0.1" value="0">
                                    <input type="range" class="range-max" min="0" max="4" step="0.1" value="4">
                                    <div class="range-track"></div>
                                    <div class="range-selected"></div>
                                </div>
                                <div class="range-values">
                                    <span class="range-value-min">0</span>
                                    <span class="range-value-max">4</span>
                                </div>
                            </div>
                            <div class="score-filter-item" data-score="value" data-max="5">
                                <div class="score-filter-header">
                                    <span class="score-label">Price Value</span>
                                    <label class="exclude-toggle">
                                        <input type="checkbox" class="score-exclude"> Exclude
                                    </label>
                                </div>
                                <div class="range-slider-container">
                                    <input type="range" class="range-min" min="0" max="5" step="0.1" value="0">
                                    <input type="range" class="range-max" min="0" max="5" step="0.1" value="5">
                                    <div class="range-track"></div>
                                    <div class="range-selected"></div>
                                </div>
                                <div class="range-values">
                                    <span class="range-value-min">0</span>
                                    <span class="range-value-max">5</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Season/Time Filter -->
                    <div class="filter-group">
                        <label>When to Wear</label>
                        <div class="when-filters">
                            <div class="when-row">
                                <span class="when-label">Season:</span>
                                <div class="checkbox-group" id="filter-season">
                                    <label class="checkbox-item">
                                        <input type="checkbox" value="spring"> Spring
                                    </label>
                                    <label class="checkbox-item">
                                        <input type="checkbox" value="summer"> Summer
                                    </label>
                                    <label class="checkbox-item">
                                        <input type="checkbox" value="fall"> Fall
                                    </label>
                                    <label class="checkbox-item">
                                        <input type="checkbox" value="winter"> Winter
                                    </label>
                                </div>
                            </div>
                            <div class="when-row">
                                <span class="when-label">Time:</span>
                                <div class="checkbox-group" id="filter-time">
                                    <label class="checkbox-item">
                                        <input type="checkbox" value="day"> Day
                                    </label>
                                    <label class="checkbox-item">
                                        <input type="checkbox" value="night"> Night
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Gender Filter -->
                    <div class="filter-group">
                        <label>Gender</label>
                        <div class="checkbox-group" id="filter-gender">
                            <label class="checkbox-item">
                                <input type="checkbox" value="male"> Male
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="more_male"> More Male
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="unisex"> Unisex
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="more_female"> More Female
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="female"> Female
                            </label>
                        </div>
                    </div>
                    <!-- Vote Status Filter -->
                    <div class="filter-group">
                        <label>Vote Status</label>
                        <div class="checkbox-group" id="filter-vote-status">
                            <label class="checkbox-item">
                                <input type="checkbox" value="has_my_vote"> Has My Votes
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="has_fragrantica"> Has Fragrantica Data
                            </label>
                        </div>
                    </div>
                    <!-- Brand Filter -->
                    <div class="filter-group">
                        <label>Brand</label>
                        <select id="filter-brand" multiple></select>
                    </div>
                    <!-- Concentration Filter -->
                    <div class="filter-group">
                        <label>Concentration</label>
                        <select id="filter-concentration" multiple></select>
                    </div>
                    <!-- Location Filter -->
                    <div class="filter-group">
                        <label>Location</label>
                        <select id="filter-location" multiple></select>
                    </div>
                    <!-- Tag Filter -->
                    <div class="filter-group">
                        <label>Tags</label>
                        <select id="filter-tag" multiple></select>
                        <div class="tags-logic">
                            <label class="radio-item">
                                <input type="radio" name="tags-logic" value="or" checked> Match Any (OR)
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="tags-logic" value="and"> Match All (AND)
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="filter-clear" class="btn btn-secondary">Clear All</button>
                    <button id="filter-apply" class="btn btn-primary">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
