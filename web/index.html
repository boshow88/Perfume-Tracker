<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">Perfume Tracker</h1>
            <div class="header-actions">
                <button id="sort-btn" class="btn btn-action">
                    <span class="icon">↕</span>
                    <span class="label">Sort</span>
                </button>
                <button id="filter-btn" class="btn btn-action">
                    <span class="icon">⏚</span>
                    <span class="label">Filter</span>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search perfumes...">
                <span class="search-icon">🔍</span>
            </div>
        </div>

        <!-- Filter Tags Display -->
        <div id="active-filters" class="active-filters hidden"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Perfume List -->
            <section class="perfume-list-section">
                <div class="list-header">
                    <span class="col-brand">Brand</span>
                    <span class="col-name">Name</span>
                    <span class="col-conc">Conc.</span>
                    <span class="col-location">Location</span>
                </div>
                <div id="perfume-list" class="perfume-list">
                    <div class="loading">Loading...</div>
                </div>
                <div class="list-footer">
                    <span id="perfume-count">0 perfumes</span>
                </div>
            </section>

            <!-- Detail Panel -->
            <aside id="detail-panel" class="detail-panel hidden">
                <button id="close-detail" class="btn-close">✕</button>
                
                <div class="detail-header">
                    <h2 id="detail-brand" class="detail-brand"></h2>
                    <h3 id="detail-name-conc" class="detail-name-conc"></h3>
                    <p id="detail-state" class="detail-state"></p>
                </div>

                <!-- Notes Section -->
                <section id="notes-section" class="detail-section hidden">
                    <h4 class="section-title">Notes</h4>
                    <div id="notes-content" class="notes-content"></div>
                </section>

                <!-- Fragrantica Section -->
                <section id="fragrantica-section" class="detail-section hidden">
                    <div class="fragrantica-header">
                        <h4 class="section-title">Fragrantica Votes</h4>
                        <button id="toggle-all-votes" class="btn btn-small">++</button>
                    </div>
                    <div id="fragrantica-content" class="fragrantica-content"></div>
                </section>

                <!-- Events Section -->
                <section id="events-section" class="detail-section hidden">
                    <h4 class="section-title">Events</h4>
                    <div id="events-content" class="events-content"></div>
                </section>

                <!-- Links Section -->
                <section id="links-section" class="detail-section hidden">
                    <h4 class="section-title">Links</h4>
                    <div id="links-content" class="links-content"></div>
                </section>

                <!-- Tags Section -->
                <section id="tags-section" class="detail-section hidden">
                    <h4 class="section-title">Tags</h4>
                    <div id="tags-content" class="tags-content"></div>
                </section>
            </aside>
        </main>

        <!-- Sort Modal -->
        <div id="sort-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-content modal-small">
                <div class="modal-header">
                    <h3>Sort</h3>
                    <button class="btn-close modal-close">✕</button>
                </div>
                <div class="modal-body">
                    <div class="sort-group">
                        <label>Sort by</label>
                        <select id="sort-field">
                            <option value="brand">Brand</option>
                            <option value="name">Name</option>
                            <option value="concentration">Concentration</option>
                            <option value="state">State</option>
                            <option value="rating">Rating</option>
                            <option value="longevity">Longevity</option>
                            <option value="sillage">Sillage</option>
                            <option value="created">Created</option>
                        </select>
                    </div>
                    <div class="sort-group">
                        <label>Direction</label>
                        <div class="sort-direction">
                            <button id="sort-asc" class="btn btn-dir active">▲ Ascending</button>
                            <button id="sort-desc" class="btn btn-dir">▼ Descending</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="sort-clear" class="btn btn-secondary">Reset</button>
                    <button id="sort-apply" class="btn btn-primary">Apply</button>
                </div>
            </div>
        </div>

        <!-- Filter Modal -->
        <div id="filter-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Filters</h3>
                    <button class="btn-close modal-close">✕</button>
                </div>
                <div class="modal-body">
                    <!-- Brand Filter -->
                    <div class="filter-group">
                        <label>Brand</label>
                        <select id="filter-brand" multiple></select>
                    </div>
                    <!-- Concentration Filter -->
                    <div class="filter-group">
                        <label>Concentration</label>
                        <select id="filter-concentration" multiple></select>
                    </div>
                    <!-- Location Filter -->
                    <div class="filter-group">
                        <label>Location</label>
                        <select id="filter-location" multiple></select>
                    </div>
                    <!-- Tag Filter -->
                    <div class="filter-group">
                        <label>Tags</label>
                        <select id="filter-tag" multiple></select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="filter-clear" class="btn btn-secondary">Clear All</button>
                    <button id="filter-apply" class="btn btn-primary">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
